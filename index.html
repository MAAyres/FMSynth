<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Battalion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="synth-container">
        <header>
            <h1>FM <span class="accent">BATTALION</span></h1>
            <button id="mobile-toggle" aria-label="Keys">🎹</button>
        </header>

        <div class="visualizer-container">
            <canvas id="oscilloscope"></canvas>
            <div class="glow-overlay"></div>
            <div id="start-overlay"><span>INIT ENGINE</span></div>
        </div>

        <div class="controls-container">
            <!-- Operators Column (Left, Large) -->
            <div class="col-operators">
                <!-- Op D -->
                <div class="op-column" data-op="D">
                    <div class="op-header">OP D</div>
                    <select id="opD-wave" class="wave-select">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Saw</option>
                        <option value="triangle">Tri</option>
                    </select>
                    <!-- Knobs injected here -->
                    <div id="opD-coarse-k"></div>
                    <div id="opD-fine-k"></div>
                    <div id="opD-level-k"></div>
                </div>
                <!-- Op C -->
                <div class="op-column" data-op="C">
                    <div class="op-header">OP C</div>
                    <select id="opC-wave" class="wave-select">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Saw</option>
                        <option value="triangle">Tri</option>
                    </select>
                    <div id="opC-coarse-k"></div>
                    <div id="opC-fine-k"></div>
                    <div id="opC-level-k"></div>
                </div>
                <!-- Op B -->
                <div class="op-column" data-op="B">
                    <div class="op-header">OP B</div>
                    <select id="opB-wave" class="wave-select">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Saw</option>
                        <option value="triangle">Tri</option>
                    </select>
                    <div id="opB-coarse-k"></div>
                    <div id="opB-fine-k"></div>
                    <div id="opB-level-k"></div>
                </div>
                <!-- Op A -->
                <div class="op-column" data-op="A">
                    <div class="op-header">OP A</div>
                    <select id="opA-wave" class="wave-select">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Saw</option>
                        <option value="triangle">Tri</option>
                    </select>
                    <div id="opA-coarse-k"></div>
                    <div id="opA-fine-k"></div>
                    <!-- Level Fixed -->
                    <div class="knob-container" style="opacity: 0.5;">
                        <span class="knob-label">Output</span>
                    </div>
                </div>
            </div>

            <!-- Modifiers Column (Middle) -->
            <div class="col-modifiers">
                <!-- Filter -->
                <div class="module">
                    <div class="module-header">LADDER FILTER</div>
                    <div style="display:flex; justify-content:space-between;">
                        <div id="f-cutoff-k"></div>
                        <div id="f-res-k"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <!-- Drive removed here -->
                        <div id="f-env-amt-k" style="width: 100%; display: flex; justify-content: center;"></div>
                    </div>
                </div>

                <!-- Filter ADSR -->
                <div class="module">
                    <div class="module-header">FILTER ENV</div>
                    <div class="adsr-row">
                        <div id="f-attack-k"></div>
                        <div id="f-decay-k"></div>
                        <div id="f-sustain-k"></div>
                        <div id="f-release-k"></div>
                    </div>
                </div>
            </div>

            <!-- Master Column (Right) -->
            <div class="col-master">
                <div class="module">
                    <div class="module-header">MASTER</div>
                    <div id="volume-k"></div>
                    <div id="saturation-k"></div> <!-- New Saturation -->
                    <div id="spread-k"></div>
                </div>

                <div class="module">
                    <div class="module-header">AMP ENV</div>
                    <div class="adsr-row">
                        <div id="attack-k"></div>
                        <div id="decay-k"></div>
                        <div id="sustain-k"></div>
                        <div id="release-k"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modulation Panel (Ableton Style) -->
        <div class="modulation-panel">
            <!-- LFOs -->
            <div class="mod-section">
                <div class="mod-header">LFOs</div>
                <div class="lfo-controls">
                    <!-- LFO 1 -->
                    <div class="lfo-unit">
                        <div class="op-header" style="font-size:0.6rem; color:#ff9d00;">LFO 1</div>
                        <select id="lfo1-wave" class="wave-select" style="width:50px; font-size:0.6rem;">
                            <option value="sine">Sin</option>
                            <option value="square">Sqr</option>
                            <option value="sawtooth">Saw</option>
                            <option value="triangle">Tri</option>
                        </select>
                        <div id="lfo1-rate-k"></div>
                    </div>
                    <!-- LFO 2 -->
                    <div class="lfo-unit">
                        <div class="op-header" style="font-size:0.6rem; color:#ff9d00;">LFO 2</div>
                        <select id="lfo2-wave" class="wave-select" style="width:50px; font-size:0.6rem;">
                            <option value="sine">Sin</option>
                            <option value="square">Sqr</option>
                            <option value="sawtooth">Saw</option>
                            <option value="triangle">Tri</option>
                        </select>
                        <div id="lfo2-rate-k"></div>
                    </div>
                </div>
            </div>

            <!-- Matrix -->
            <div class="matrix-container">
                <div class="mod-header">MODULATION MATRIX</div>
                <div class="matrix-grid">
                    <!-- Headers -->
                    <div class="matrix-header-cell" style="text-align:left; padding-left:10px;">Target</div>
                    <div class="matrix-header-cell">LFO 1</div>
                    <div class="matrix-header-cell">LFO 2</div>
                    <div class="matrix-header-cell" style="color:#00d2ff;">Filter Env</div>
                    <div class="matrix-header-cell" style="color:#00d2ff;">Amp Env</div>

                    <!-- Dynamic Row -->
                    <div class="matrix-row" id="matrix-row-active">
                        <div class="matrix-target-name" id="mod-target-name">Select Knob...</div>

                        <!-- LFO 1 -->
                        <div class="matrix-cell" data-source="lfo1">
                            <span class="matrix-val">0</span>
                            <div class="matrix-bar-pos" style="height:0%"></div>
                            <div class="matrix-bar-neg" style="height:0%"></div>
                        </div>

                        <!-- LFO 2 -->
                        <div class="matrix-cell" data-source="lfo2">
                            <span class="matrix-val">0</span>
                            <div class="matrix-bar-pos" style="height:0%"></div>
                            <div class="matrix-bar-neg" style="height:0%"></div>
                        </div>

                        <!-- Env 1 -->
                        <div class="matrix-cell" data-source="env1">
                            <span class="matrix-val">0</span>
                            <div class="matrix-bar-pos" style="height:0%"></div>
                            <div class="matrix-bar-neg" style="height:0%"></div>
                        </div>

                        <!-- Env 2 -->
                        <div class="matrix-cell" data-source="env2">
                            <span class="matrix-val">0</span>
                            <div class="matrix-bar-pos" style="height:0%"></div>
                            <div class="matrix-bar-neg" style="height:0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Virtual Keyboard -->
        <div id="virtual-keyboard" class="virtual-keyboard">
            <div class="octave-controls">
                <button id="oct-down" class="oct-btn">&lt; OCT</button>
                <span id="oct-disp">0</span>
                <button id="oct-up" class="oct-btn">OCT &gt;</button>
            </div>
            <div class="keys-container" id="keys-container">
                <!-- Keys injected by JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
